<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shifting Earth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="background">
    <h1 id="title">Random Shifting Earth Selector</h1>
    <button  id="button" onclick="getRandomLocation()">Get Random Location</button>
    <div id="location"></div>
    <div id="imageColumns">
    <div id="left-column">
       <img src="./Images/crater.jpg" alt="Crater Image" id="craterImage" width="500" height="300">
       <img src="./Images/caelid.webp" alt="Caelid Image" id="caelidImage" width="500" height="300">
    </div>

    <div id="right-column">
       <img src="./Images/cave.jpg" alt="Cave Image" id="caveImage" width="500" height="300">
      <img src="./Images/noklataeo.webp" alt="Noklateo Image" id="noklateoImage" width="500" height="300">
    </div>
</div>
    <script>
        function getRandomLocation() {
            const shiftingEarth = ['Caelid', 'Mountaintop', 'Noklateo', 'Nothing', 'Volcano', 'The Great Hollow']; 
            const random = Math.floor(Math.random() * shiftingEarth.length);   
            document.getElementById('location').innerHTML = "<p id=\"locationDisplay\">Your shifting earth location is " + shiftingEarth[random] + "!</p>" +
                                                                  "<p id=\"haveFunTxt\">Have fun! (Unless you got the Mountaintop)</p>";
        }
    </script>


</div>

</body>
</html>
